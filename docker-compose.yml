# Запуск price-tags в Docker: docker compose up -d, интерфейс http://адрес:8082/
# Справочники организаций и товаров в томе price-tags-data. Авторизации нет: только доверенная сеть.
services:
  price-tags:
    image: ghcr.io/khromenokroman/price-tags:latest
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - price-tags-data:/data

volumes:
  price-tags-data:
